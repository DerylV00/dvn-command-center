<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fellowship of Minds - Philosophy & Concept</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
        #root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        
        const PresentationDeck = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            
            const slides = [
                { id: 0, component: <TitleSlide /> },
                { id: 1, component: <TheProblemSlide /> },
                { id: 2, component: <OurThesisSlide /> },
                { id: 3, component: <WhatWeAreSlide /> },
                { id: 4, component: <CorePrinciplesSlide /> },
                { id: 5, component: <HowItWorksSlide /> },
                { id: 6, component: <TheVisionSlide /> }
            ];
            
            const nextSlide = () => { if (currentSlide < slides.length - 1) setCurrentSlide(currentSlide + 1); };
            const prevSlide = () => { if (currentSlide > 0) setCurrentSlide(currentSlide - 1); };
            const goToSlide = (index) => { setCurrentSlide(index); };
            
            return (
                <div style={{ width: '100%', height: '100%', position: 'relative', background: 'linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%)' }}>
                    {slides[currentSlide].component}
                    
                    <div style={{ position: 'absolute', bottom: '30px', left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: '20px', alignItems: 'center', zIndex: 1000 }}>
                        <button onClick={prevSlide} disabled={currentSlide === 0} style={{ background: 'rgba(255, 255, 255, 0.2)', border: 'none', color: 'white', padding: '12px 24px', borderRadius: '8px', cursor: currentSlide === 0 ? 'not-allowed' : 'pointer', fontSize: '16px', opacity: currentSlide === 0 ? 0.3 : 1, backdropFilter: 'blur(10px)', transition: 'all 0.3s' }}>← Previous</button>
                        
                        <div style={{ display: 'flex', gap: '10px' }}>
                            {slides.map((_, index) => (
                                <button key={index} onClick={() => goToSlide(index)} style={{ width: '12px', height: '12px', borderRadius: '50%', border: 'none', background: index === currentSlide ? 'linear-gradient(135deg, #FF6B9D, #C06CFF)' : 'rgba(255, 255, 255, 0.3)', cursor: 'pointer', transition: 'all 0.3s' }} />
                            ))}
                        </div>
                        
                        <button onClick={nextSlide} disabled={currentSlide === slides.length - 1} style={{ background: 'linear-gradient(135deg, #FF6B9D, #C06CFF)', border: 'none', color: 'white', padding: '12px 24px', borderRadius: '8px', cursor: currentSlide === slides.length - 1 ? 'not-allowed' : 'pointer', fontSize: '16px', opacity: currentSlide === slides.length - 1 ? 0.3 : 1, transition: 'all 0.3s', fontWeight: '600' }}>Next →</button>
                    </div>
                    
                    <div style={{ position: 'absolute', top: '30px', right: '40px', color: 'rgba(255, 255, 255, 0.6)', fontSize: '14px', fontWeight: '500' }}>{currentSlide + 1} / {slides.length}</div>
                </div>
            );
        };
        
        const TitleSlide = () => (
            <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', background: 'linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #2d1b3d 100%)', position: 'relative', overflow: 'hidden' }}>
                <div style={{ position: 'absolute', top: '10%', right: '10%', width: '400px', height: '400px', background: 'radial-gradient(circle, rgba(255, 107, 157, 0.2) 0%, transparent 70%)', borderRadius: '50%', filter: 'blur(80px)' }} />
                <div style={{ position: 'absolute', bottom: '15%', left: '10%', width: '350px', height: '350px', background: 'radial-gradient(circle, rgba(192, 108, 255, 0.2) 0%, transparent 70%)', borderRadius: '50%', filter: 'blur(70px)' }} />
                <div style={{ position: 'absolute', top: '40%', left: '50%', width: '300px', height: '300px', background: 'radial-gradient(circle, rgba(0, 206, 209, 0.15) 0%, transparent 70%)', borderRadius: '50%', filter: 'blur(60px)', transform: 'translateX(-50%)' }} />
                
                <div style={{ textAlign: 'center', zIndex: 2, maxWidth: '1000px', padding: '0 40px' }}>
                    <div style={{ fontSize: '84px', fontWeight: '900', background: 'linear-gradient(135deg, #FF6B9D 0%, #00CED1 50%, #C06CFF 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', marginBottom: '40px', letterSpacing: '-3px', lineHeight: '1.1' }}>
                        FELLOWSHIP<br/>OF MINDS
                    </div>
                    <div style={{ fontSize: '28px', color: 'rgba(255, 255, 255, 0.9)', fontWeight: '300', marginBottom: '30px', lineHeight: '1.5', letterSpacing: '1px' }}>
                        Building Infrastructure for Positive-Sum Collaboration
                    </div>
                    <div style={{ width: '120px', height: '4px', background: 'linear-gradient(135deg, #FF6B9D, #C06CFF)', margin: '0 auto', borderRadius: '2px' }} />
                </div>
            </div>
        );
        
        const TheProblemSlide = () => (
            <div style={{ width: '100%', height: '100%', padding: '60px 80px', overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
                <div style={{ fontSize: '48px', fontWeight: '900', color: 'white', marginBottom: '40px' }}>The World We Inherited</div>
                
                <div style={{ background: 'rgba(255, 107, 157, 0.1)', border: '2px solid rgba(255, 107, 157, 0.4)', borderRadius: '20px', padding: '40px', marginBottom: '30px' }}>
                    <div style={{ fontSize: '24px', fontWeight: '800', color: '#FF6B9D', marginBottom: '20px' }}>A System Built on Extraction, Not Alignment</div>
                    <div style={{ fontSize: '18px', color: 'white', lineHeight: '1.7' }}>
                        The current paradigm assumes scarcity, competition, and zero-sum thinking. Value is extracted, not created together. Winners take all, losers are left behind. Collaboration is rare because the structures don't support it.
                    </div>
                </div>
                
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '25px', marginBottom: '30px' }}>
                    <div style={{ background: 'rgba(192, 108, 255, 0.1)', border: '2px solid rgba(192, 108, 255, 0.4)', borderRadius: '16px', padding: '30px' }}>
                        <div style={{ fontSize: '20px', fontWeight: '700', color: '#C06CFF', marginBottom: '15px' }}>🏢 IN BUSINESS</div>
                        <div style={{ fontSize: '15px', color: 'white', lineHeight: '1.7' }}>
                            Companies compete for the same resources, talent, and capital. Partnerships are transactional. "Collaboration" means negotiating who gives up the least. Trust is low. Value created together is left on the table.
                        </div>
                    </div>
                    
                    <div style={{ background: 'rgba(0, 206, 209, 0.1)', border: '2px solid rgba(0, 206, 209, 0.4)', borderRadius: '16px', padding: '30px' }}>
                        <div style={{ fontSize: '20px', fontWeight: '700', color: '#00CED1', marginBottom: '15px' }}>🎨 IN CULTURE</div>
                        <div style={{ fontSize: '15px', color: 'white', lineHeight: '1.7' }}>
                            Creators are paid last, own nothing, and compete with each other. Institutions extract value from artists. Cultural assets are illiquid. Collaboration is ad-hoc. There's no infrastructure for co-ownership.
                        </div>
                    </div>
                    
                    <div style={{ background: 'rgba(255, 165, 0, 0.1)', border: '2px solid rgba(255, 165, 0, 0.4)', borderRadius: '16px', padding: '30px' }}>
                        <div style={{ fontSize: '20px', fontWeight: '700', color: '#FFA500', marginBottom: '15px' }}>💰 IN FINANCE</div>
                        <div style={{ fontSize: '15px', color: 'white', lineHeight: '1.7' }}>
                            Investors seek maximum extraction from founders. Capital comes with control, not partnership. Exit pressure overrides long-term value creation. Alignment of interests is rare. Everyone optimizes for themselves.
                        </div>
                    </div>
                    
                    <div style={{ background: 'rgba(255, 107, 157, 0.1)', border: '2px solid rgba(255, 107, 157, 0.4)', borderRadius: '16px', padding: '30px' }}>
                        <div style={{ fontSize: '20px', fontWeight: '700', color: '#FF6B9D', marginBottom: '15px' }}>🌍 IN SOCIETY</div>
                        <div style={{ fontSize: '15px', color: 'white', lineHeight: '1.7' }}>
                            Communities fracture along tribal lines. Collaboration is seen as weakness. "Winning" means someone else loses. Shared prosperity is dismissed as utopian. We lack tools for building together.
                        </div>
                    </div>
                </div>
                
                <div style={{ background: 'linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(192, 108, 255, 0.2))', border: '2px solid rgba(255, 255, 255, 0.3)', borderRadius: '20px', padding: '40px', textAlign: 'center' }}>
                    <div style={{ fontSize: '32px', fontWeight: '800', color: 'white', marginBottom: '20px' }}>The Core Problem</div>
                    <div style={{ fontSize: '20px', color: 'rgba(255, 255, 255, 0.9)', lineHeight: '1.6' }}>
                        We don't have <strong style={{ color: '#FF6B9D' }}>infrastructure for alignment</strong>. The structures, tools, and economic models that would enable positive-sum collaboration <strong style={{ color: '#00CED1' }}>don't exist yet</strong>. So we default to extraction, competition, and zero-sum thinking—not because we want to, but because those are the only systems available.
                    </div>
                </div>
            </div>
        );
        
        const OurThesisSlide = () => (
            <div style={{ width: '100%', height: '100%', padding: '60px 80px', overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
                <div style={{ fontSize: '48px', fontWeight: '900', color: 'white', marginBottom: '40px' }}>Our Thesis</div>
                
                <div style={{ background: 'rgba(0, 206, 209, 0.1)', border: '2px solid rgba(0, 206, 209, 0.4)', borderRadius: '20px', padding: '50px', marginBottom: '30px', textAlign: 'center' }}>
                    <div style={{ fontSize: '36px', fontWeight: '900', color: '#00CED1', marginBottom: '25px', lineHeight: '1.3' }}>
                        Positive-Sum Collaboration<br/>is Inevitable
                    </div>
                    <div style={{ fontSize: '20px', color: 'white', lineHeight: '1.7' }}>
                        The question isn't whether we move from extraction to alignment—it's <strong>who builds the infrastructure that makes it possible</strong>. The world is shifting from zero-sum to positive-sum thinking. The infrastructure will determine the speed and quality of that shift.
                    </div>
                </div>
                
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '20px', marginBottom: '30px' }}>
                    <div style={{ background: 'rgba(255, 107, 157, 0.1)', border: '2px solid rgba(255, 107, 157, 0.4)', borderRadius: '16px', padding: '30px', textAlign: 'center' }}>
                        <div style={{ fontSize: '48px', marginBottom: '15px' }}>🌱</div>
                        <div style={{ fontSize: '18px', fontWeight: '700', color: '#FF6B9D', marginBottom: '12px' }}>Abundance Mindset</div>
                        <div style={{ fontSize: '14px', color: 'white', lineHeight: '1.6' }}>
                            Value isn't fixed. It grows when people collaborate well. The pie expands when everyone contributes their unique strengths.
                        </div>
                    </div>
                    
                    <div style={{ background: 'rgba(192, 108, 255, 0.1)', border: '2px solid rgba(192, 108, 255, 0.4)', borderRadius: '16px', padding: '30px', textAlign: 'center' }}>
                        <div style={{ fontSize: '48px', marginBottom: '15px' }}>🔗</div>
                        <div style={{ fontSize: '18px', fontWeight: '700', color: '#C06CFF', marginBottom: '12px' }}>Alignment Over Agreement</div>
                        <div style={{ fontSize: '14px', color: 'white', lineHeight: '1.6' }}>
                            You don't need to agree on everything. You need structures that align incentives so everyone wins when the collaboration succeeds.
                        </div>
                    </div>
                    
                    <div style={{ background: 'rgba(255, 165, 0, 0.1)', border: '2px solid rgba(255, 165, 0, 0.4)', borderRadius: '16px', padding: '30px', textAlign: 'center' }}>
                        <div style={{ fontSize: '48px', marginBottom: '15px' }}>🏗️</div>
                        <div style={{ fontSize: '18px', fontWeight: '700', color: '#FFA500', marginBottom: '12px' }}>Infrastructure Creates Behavior</div>
                        <div style={{ fontSize: '14px', color: 'white', lineHeight: '1.6' }}>
                            People default to extraction because that's what current systems reward. Build different infrastructure, get different behavior.
                        </div>
                    </div>
                </div>
                
                <div style={{ background: 'rgba(255, 255, 255, 0.05)', borderRadius: '20px', padding: '40px', marginBottom: '30px' }}>
                    <div style={{ fontSize: '24px', fontWeight: '700', color: 'white', marginBottom: '20px' }}>What We Believe</div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', fontSize: '16px', color: 'white', lineHeight: '1.7' }}>
                        <div>
                            ✦ <strong style={{ color: '#FF6B9D' }}>Co-ownership creates better outcomes</strong> than extraction. When everyone owns a piece, everyone cares about the whole.
                        </div>
                        <div>
                            ✦ <strong style={{ color: '#00CED1' }}>Transparency builds trust</strong> faster than contracts. Radical openness about money, decisions, and power reduces friction.
                        </div>
                        <div>
                            ✦ <strong style={{ color: '#FFA500' }}>Diversity of thought</strong> creates more value than homogeneity. Different perspectives compound when aligned properly.
                        </div>
                        <div>
                            ✦ <strong style={{ color: '#C06CFF' }}>Long-term thinking</strong> beats short-term extraction. Sustainable collaboration outlasts any single deal.
                        </div>
                    </div>
                </div>
                
                <div style={{ background: 'linear-gradient(135deg, rgba(0, 206, 209, 0.2), rgba(192, 108, 255, 0.2))', border: '2px solid rgba(255, 255, 255, 0.3)', borderRadius: '16px', padding: '30px', textAlign: 'center' }}>
                    <div style={{ fontSize: '20px', fontWeight: '800', color: 'white', marginBottom: '12px' }}>The Shift is Already Happening</div>
                    <div style={{ fontSize: '16px', color: 'rgba(255, 255, 255, 0.9)', lineHeight: '1.6' }}>
                        DAOs, cooperatives, creator economies, tokenized assets, transparent governance—these are early experiments in positive-sum infrastructure. Most will fail. But the direction is clear: <strong>the future belongs to those who can build together, not just compete.</strong>
                    </div>
                </div>
            </div>
        );
        
        const WhatWeAreSlide = () => (
            <div style={{ width: '100%', height: '100%', padding: '60px 80px', overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
                <div style={{ fontSize: '48px', fontWeight: '900', color: 'white', marginBottom: '40px' }}>What Fellowship of Minds Is</div>
                
                <div style={{ background: 'rgba(255, 107, 157, 0.1)', border: '2px solid rgba(255, 107, 157, 0.4)', borderRadius: '20px', padding: '50px', marginBottom: '30px', textAlign: 'center' }}>
                    <div style={{ fontSize: '32px', fontWeight: '900', color: '#FF6B9D', marginBottom: '20px' }}>
                        A Strategic Alignment Company
                    </div>
                    <div style={{ fontSize: '20px', color: 'white', lineHeight: '1.7' }}>
                        We design and build the <strong>infrastructure</strong>, <strong>economic models</strong>, and <strong>governance structures</strong> that make positive-sum collaboration real. We don't just talk about alignment—we architect it.
                    </div>
                </div>
                
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '25px', marginBottom: '30px' }}>
                    <div style={{ background: 'rgba(0, 206, 209, 0.1)', border: '2px solid rgba(0, 206, 209, 0.4)', borderRadius: '16px', padding: '30px' }}>
                        <div style={{ fontSize: '20px', fontWeight: '700', color: '#00CED1', marginBottom: '15px' }}>WHAT WE DO</div>
                        <div style={{ fontSize: '16px', color: 'white', lineHeight: '1.7', marginBottom: '15px' }}>
                            We find opportunities where multiple parties could create more value together than separately—but don't, because the infrastructure doesn't exist.
                        </div>
                        <div style={{ fontSize: '15px', color: 'rgba(255, 255, 255, 0.9)', lineHeight: '1.6' }}>
                            • Identify strategic opportunities for positive-sum collaboration<br/>
                            • Design the legal, economic, and governance structures<br/>
                            • Build the tools and platforms that make it operational<br/>
                            • Take equity/carry in the value we help create
                        </div>
                    </div>
                    
                    <div style={{ background: 'rgba(255, 165, 0, 0.1)', border: '2px solid rgba(255, 165, 0, 0.4)', borderRadius: '16px', padding: '30px' }}>
                        <div style={{ fontSize: '20px', fontWeight: '700', color: '#FFA500', marginBottom: '15px' }}>WHAT WE'RE NOT</div>
                        <div style={{ fontSize: '16px', color: 'white', lineHeight: '1.7', marginBottom: '15px' }}>
                            We're not a consultancy, a community platform, or a content studio. We're not selling services or memberships.
                        </div>
                        <div style={{ fontSize: '15px', color: 'rgba(255, 255, 255, 0.9)', lineHeight: '1.6' }}>
                            ✗ Not a consultancy (we take equity, not fees)<br/>
                            ✗ Not a platform (we build infrastructure, not audiences)<br/>
                            ✗ Not a community (we create alignment, not belonging)<br/>
                            ✗ Not a fund (we design deals, not deploy capital)
                        </div>
                    </div>
                </div>
                
                <div style={{ background: 'rgba(192, 108, 255, 0.1)', border: '2px solid rgba(192, 108, 255, 0.4)', borderRadius: '20px', padding: '40px', marginBottom: '25px' }}>
                    <div style={{ fontSize: '24px', fontWeight: '700', color: '#C06CFF', marginBottom: '20px' }}>The Product is the ALIGNMENT Itself</div>
                    <div style={{ fontSize: '18px', color: 'white', lineHeight: '1.7' }}>
                        Master Minds, ConnectMe platform, content projects, tokenization frameworks—these are <strong>vehicles for alignment</strong>, not the end product. The product is getting diverse stakeholders rowing in the same direction, creating value none could create alone.
                    </div>
                </div>
                
                <div style={{ background: 'linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(0, 206, 209, 0.2))', border: '2px solid rgba(255, 255, 255, 0.3)', borderRadius: '16px', padding: '35px' }}>
                    <div style={{ fontSize: '22px', fontWeight: '800', color: 'white', marginBottom: '15px', textAlign: 'center' }}>Think of Us As...</div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '15px', fontSize: '15px', color: 'white', lineHeight: '1.6', textAlign: 'center' }}>
                        <div>
                            <strong style={{ color: '#FF6B9D' }}>Infrastructure Architects</strong><br/>
                            Building the rails for collaboration
                        </div>
                        <div>
                            <strong style={{ color: '#00CED1' }}>Economic Designers</strong><br/>
                            Creating incentive structures that work
                        </div>
                        <div>
                            <strong style={{ color: '#FFA500' }}>Alignment Engineers</strong><br/>
                            Making positive-sum real, not theoretical
                        </div>
                    </div>
                </div>
            </div>
        );
        
        const CorePrinciplesSlide = () => (
            <div style={{ width: '100%', height: '100%', padding: '60px 80px', overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
                <div style={{ fontSize: '48px', fontWeight: '900', color: 'white', marginBottom: '40px' }}>Core Principles</div>
                
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '25px', marginBottom: '25px' }}>
                    <div style={{ background: 'rgba(255, 107, 157, 0.1)', border: '2px solid rgba(255, 107, 157, 0.4)', borderRadius: '16px', padding: '35px' }}>
                        <div style={{ fontSize: '24px', fontWeight: '800', color: '#FF6B9D', marginBottom: '15px' }}>1. Radical Transparency</div>
                        <div style={{ fontSize: '16px', color: 'white', lineHeight: '1.7' }}>
                            All economics, governance, and decisions are visible to everyone involved. No hidden terms, no backroom deals, no information asymmetry. Transparency reduces friction and builds trust faster than any contract.
                        </div>
                    </div>
                    
                    <div style={{ background: 'rgba(0, 206, 209, 0.1)', border: '2px solid rgba(0, 206, 209, 0.4)', borderRadius: '16px', padding: '35px' }}>
                        <div style={{ fontSize: '24px', fontWeight: '800', color: '#00CED1', marginBottom: '15px' }}>2. Shared Ownership</div>
                        <div style={{ fontSize: '16px', color: 'white', lineHeight: '1.7' }}>
                            Everyone who contributes owns a piece. Equity, carry, tokens—the mechanism matters less than the principle: if you helped create value, you share in the upside. Co-ownership creates better outcomes than extraction.
                        </div>
                    </div>
                    
                    <div style={{ background: 'rgba(192, 108, 255, 0.1)', border: '2px solid rgba(192, 108, 255, 0.4)', borderRadius: '16px', padding: '35px' }}>
                        <div style={{ fontSize: '24px', fontWeight: '800', color: '#C06CFF', marginBottom: '15px' }}>3. Positive-Sum Economics</div>
                        <div style={{ fontSize: '16px', color: 'white', lineHeight: '1.7' }}>
                            We only pursue opportunities where everyone can win. If the deal requires someone to lose for others to gain, we don't do it. The world has enough zero-sum games. We're building infrastructure for abundance.
                        </div>
                    </div>
                    
                    <div style={{ background: 'rgba(255, 165, 0, 0.1)', border: '2px solid rgba(255, 165, 0, 0.4)', borderRadius: '16px', padding: '35px' }}>
                        <div style={{ fontSize: '24px', fontWeight: '800', color: '#FFA500', marginBottom: '15px' }}>4. Long-Term Orientation</div>
                        <div style={{ fontSize: '16px', color: 'white', lineHeight: '1.7' }}>
                            We optimize for sustainable collaboration, not quick exits. 4-year vesting schedules, multi-decade thinking, infrastructure that outlasts any single deal. Short-term extraction is easy. Long-term alignment is rare—and valuable.
                        </div>
                    </div>
                </div>
                
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '25px', marginBottom: '25px' }}>
                    <div style={{ background: 'rgba(255, 107, 157, 0.1)', border: '2px solid rgba(255, 107, 157, 0.4)', borderRadius: '16px', padding: '35px' }}>
                        <div style={{ fontSize: '24px', fontWeight: '800', color: '#FF6B9D', marginBottom: '15px' }}>5. Compassionate Design</div>
                        <div style={{ fontSize: '16px', color: 'white', lineHeight: '1.7' }}>
                            Technology serves human flourishing. AI, blockchain, smart contracts—these are tools, not ends. We design systems that enhance dignity, agency, and connection. If the tech doesn't serve humanity, we don't use it.
                        </div>
                    </div>
                    
                    <div style={{ background: 'rgba(0, 206, 209, 0.1)', border: '2px solid rgba(0, 206, 209, 0.4)', borderRadius: '16px', padding: '35px' }}>
                        <div style={{ fontSize: '24px', fontWeight: '800', color: '#00CED1', marginBottom: '15px' }}>6. Decentralized Power</div>
                        <div style={{ fontSize: '16px', color: 'white', lineHeight: '1.7' }}>
                            No single entity should control the infrastructure. Governance is distributed. Power is shared. Decisions flow from consensus, not hierarchy. We're building commons, not empires.
                        </div>
                    </div>
                </div>
                
                <div style={{ background: 'linear-gradient(135deg, rgba(192, 108, 255, 0.2), rgba(255, 107, 157, 0.2))', border: '2px solid rgba(255, 255, 255, 0.3)', borderRadius: '20px', padding: '40px', textAlign: 'center' }}>
                    <div style={{ fontSize: '28px', fontWeight: '800', color: 'white', marginBottom: '15px' }}>These Aren't Just Values—They're Design Constraints</div>
                    <div style={{ fontSize: '18px', color: 'rgba(255, 255, 255, 0.9)', lineHeight: '1.6' }}>
